<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Novum</title>
  <meta name="description" content="A new beginning. A new standard. A new you.">
  <meta name="theme-color" content="#04060b">
  <meta name="color-scheme" content="dark">

  <!-- iOS home-screen app behaviour -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Novum">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="vendor/preact-htm.js">
</head>
<body>
  <div id="app"><div class="boot">NOVUM</div></div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // If a page was already controlled and a new worker takes over, a new version is ready
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController) return;
        window.__novumUpdate = true;
        window.dispatchEvent(new Event('novum-update'));
      });
      addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          // Check for updates whenever the app comes back to the foreground
          document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
        }).catch((e) => console.warn('SW failed', e));
      });
    }
  </script>
</body>
</html>
